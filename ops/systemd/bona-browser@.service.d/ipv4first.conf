# 2026-10-06: IPv6 connections from this WSL host to Cloudflare (tk-storage.azoz.uk) are reset ~1 in 4
# (curl -6 9/12, node default 15/18 with ECONNRESET), while IPv4 succeeded 30/30. The 20:30 run failed
# on both channels with "fetch failed" before any intent. Prefer IPv4 for the publisher's fetches.
# Remove this file and `systemctl --user daemon-reload` to undo.
[Service]
Environment=NODE_OPTIONS=--dns-result-order=ipv4first
