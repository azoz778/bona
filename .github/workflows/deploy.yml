name: Build & deploy (GitHub Pages)

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'   # 06:00 Asia/Riyadh daily — refresh listings from TK and rebuild
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - run: npm ci
      - name: Sync listings from TK (non-fatal)
        run: node scripts/sync-listings.mjs || echo "sync skipped"
      # The sync edits listings.json in place (status, price, tour URL) without going
      # through scripts/curate/build.mjs, so the publication rules are re-checked here.
      # A synced price that pushes a house over the public-site cap fails the deploy
      # rather than quietly republishing a home the cap exists to hide.
      - run: node scripts/curate/validate.mjs
      - run: node scripts/og/gen-llms.mjs
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node scripts/og/gen-llms.mjs && npm run build
      - name: IndexNow ping (non-fatal)
        run: node scripts/indexnow.mjs --dir dist || true
