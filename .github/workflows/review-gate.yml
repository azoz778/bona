name: Two-model review gate

# Sets the commit status `two-model-review` on the PR head: success only when the newest Claude and
# Codex verdicts by the owner's account are both exactly `<Model> review: SHIP <sha>` for the CURRENT
# head (scripts/ci/review_gate.py). The `main` ruleset requires it, so an auto-merge waits for it.
#
# Safety: pull_request_target and issue_comment run with a write token, so this job checks out ONLY
# the default branch's copy of the gate script (never the PR's code) and runs nothing else.
# pull_request_target also means a PR cannot change the gate it is judged by.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created, edited, deleted]
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions:
  contents: read
  statuses: write
  pull-requests: read
  issues: read

concurrency:
  # One run at a time per PR; a newer event replaces a queued one, and every run reads fresh state.
  group: review-gate-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  gate:
    # Comments: only PR comments by the owner's account can change the result.
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request && github.event.comment.user.login == 'azoz778')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: scripts/ci
      - name: Set two-model-review on the PR head
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/ci/review_gate.py
